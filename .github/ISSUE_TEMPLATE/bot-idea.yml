name: Bot idea
description: Suggest an improvement to one of this catalog's bots.
labels: [enhancement]
body:
  - type: input
    id: bot
    attributes:
      label: Which bot?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What should it do differently, and why?
    validations:
      required: true
