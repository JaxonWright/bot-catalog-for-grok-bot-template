name: Fork check

# A fork's pull request runs its own copy of ci.yml, so it could switch those checks off.
# This job runs this repository's copy of scripts/catalog.py instead and only reads the fork's files.
# It gets no PRIVATE_DENYLIST, so a fork can't probe the secret by guessing entries.
# master requires this check. On a pull request from this repository it is skipped, which counts as passing.
on:
  pull_request_target:
  # The Build workflow dispatches this after it commits, so the new commit gets its skipped, passing check too.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fork-check:
    if: github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out this repository's scripts
        uses: actions/checkout@v4
        with:
          path: trusted
          persist-credentials: false

      - name: Check out the pull request's files
        uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/head
          path: pr
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check that the fork changes only bots, and no share link
        env:
          CATALOG_ROOT: pr
          BASE: ${{ github.base_ref }}
        run: python trusted/scripts/catalog.py check --base "origin/$BASE" --fork
