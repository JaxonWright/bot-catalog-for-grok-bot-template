name: CI

on:
  pull_request:
  push:
    branches: [master]
  # The Build workflow dispatches this after it commits, because its own pushes don't trigger workflows.
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test the checks
        run: python -m unittest discover -s scripts

      - name: Check bots and privacy
        env:
          PRIVATE_DENYLIST: ${{ secrets.PRIVATE_DENYLIST }}
          BASE: ${{ github.event_name == 'pull_request' && github.base_ref || github.event_name == 'workflow_dispatch' && 'master' || '' }}
        run: |
          args=(--generated)
          if [ -n "$BASE" ]; then args+=(--base "origin/$BASE"); fi
          python scripts/catalog.py check "${args[@]}"

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
