name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # The pull request's own commits, not the merge commit GitHub makes to test it, which never lands in
      # history. master requires branches to be up to date, so they match.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Check bots, privacy, and secrets
        env:
          PRIVATE_DENYLIST: ${{ secrets.PRIVATE_DENYLIST }}
          BASE: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -n "$BASE" ]; then
            export RANGE="origin/$BASE..HEAD"
          elif git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            export RANGE="$BEFORE..HEAD"
          else
            export RANGE=HEAD
          fi
          scripts/check.sh
