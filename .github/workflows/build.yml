name: Build

# Regenerates the README table, avatars, and install bundles on each pull request branch in this repository,
# so a pull request carries its generated files when it merges. A fork's branch can't be pushed to.
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  actions: write

concurrency:
  group: build-${{ github.head_ref }}

jobs:
  build:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      # No saved credentials while the build reads the branch's files. The push step adds them.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Regenerate the README, avatars, and install bundles
        run: python scripts/catalog.py build

      - name: Commit and re-check
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.head_ref }}
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Generated files are already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Regenerate catalog files"
          gh auth setup-git
          git push origin "HEAD:$BRANCH"
          gh workflow run ci.yml --ref "$BRANCH"
          gh workflow run fork-check.yml --ref "$BRANCH"
