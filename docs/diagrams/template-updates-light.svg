<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 992 307" width="992" height="307" role="img" aria-label="Template-owned files reach a catalog by pull request, which bumps and releases its bots."><style>text{font-family:-apple-system, Segoe UI, Helvetica, Arial, sans-serif;fill:#15201e}.tt{font-size:13px;font-weight:600}.tm,.tma{font:600 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;fill:#15201e}.tma{fill:#0e7468}.ts{font-size:11.5px;fill:#566864}.tl{font-size:11.5px;font-style:italic;fill:#566864}rect{stroke-width:1.5}.file{fill:#ffffff;stroke:#a9b9b5}.auto,.out{fill:#e0f1ed;stroke:#0e7468}.out{stroke-width:3.2}.gate{fill:#fbeedb;stroke:#9a5806;stroke-dasharray:5 3}.bot{fill:#e9ecf8;stroke:#3f4f8c}.panel{fill:none;stroke:#a9b9b5;stroke-width:1;stroke-dasharray:2 3}.rule{stroke:#a9b9b5}.edge{fill:none;stroke:#566864;stroke-width:1.4}.edge.accent{stroke:#0e7468;stroke-width:2}</style><defs><marker id="h" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#566864"/></marker><marker id="ha" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0e7468"/></marker></defs><rect x="-16" y="-16" width="992" height="307" rx="10" fill="#fbfdfc" stroke="#a9b9b5" stroke-width="1"/><rect class="panel" x="10" y="20" width="300" height="240" rx="8"/><text class="tt" x="26" y="44">Template repo, master</text><rect class="auto" x="26" y="60" width="268" height="184" rx="6"/><text class="tm" x="160.0" y="103.5" text-anchor="middle">template_paths</text><text class="ts" x="160.0" y="119.5" text-anchor="middle">.github/  scripts/  catalog/</text><text class="ts" x="160.0" y="134.5" text-anchor="middle">docs/  CONTRIBUTING.md</text><text class="ts" x="160.0" y="149.5" text-anchor="middle">SECURITY.md  .gitignore</text><text class="ts" x="160.0" y="164.5" text-anchor="middle">assets/add-grok-bot.svg</text><text class="ts" x="160.0" y="179.5" text-anchor="middle"></text><text class="ts" x="160.0" y="194.5" text-anchor="middle">listed in .github/</text><text class="ts" x="160.0" y="209.5" text-anchor="middle">template-files.txt</text><rect class="panel" x="470" y="20" width="300" height="240" rx="8"/><text class="tt" x="486" y="44">Your catalog, master</text><rect class="auto" x="486" y="60" width="268" height="100" rx="6"/><text class="tt" x="620.0" y="91.5" text-anchor="middle">Template-owned copy</text><text class="ts" x="620.0" y="107.5" text-anchor="middle">replaced on your yes;</text><text class="ts" x="620.0" y="122.5" text-anchor="middle">files the new list drops</text><text class="ts" x="620.0" y="137.5" text-anchor="middle">are deleted</text><rect class="file" x="486" y="172" width="268" height="72" rx="6"/><text class="tt" x="620.0" y="204.5" text-anchor="middle">Yours, never touched</text><text class="ts" x="620.0" y="220.5" text-anchor="middle">bots/  catalog.toml  README.md</text><polyline class="edge accent" points="294,110 484,110" marker-end="url(#ha)"/><text class="tl" x="390" y="84" text-anchor="middle">Monday check finds a diff,</text><text class="tl" x="390" y="98" text-anchor="middle">opens a PR on your yes</text><rect class="auto" x="810" y="20" width="140" height="46" rx="6"/><text class="tt" x="880.0" y="39.5" text-anchor="middle">Bump each bot</text><text class="ts" x="880.0" y="55.5" text-anchor="middle">patch version</text><rect class="gate" x="810" y="84" width="140" height="46" rx="6"/><text class="tt" x="880.0" y="103.5" text-anchor="middle">Merge</text><text class="ts" x="880.0" y="119.5" text-anchor="middle">your yes</text><rect class="auto" x="810" y="148" width="140" height="46" rx="6"/><text class="tt" x="880.0" y="175.0" text-anchor="middle">Release tags</text><rect class="bot" x="810" y="212" width="140" height="48" rx="6"/><text class="tt" x="880.0" y="232.5" text-anchor="middle">Bots offer it</