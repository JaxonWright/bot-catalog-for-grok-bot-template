<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 1032 332" width="1032" height="332" role="img" aria-label="Files with placeholders go through catalog.py build into dist. The installed bot reads only bot.toml, the dist bundle, and the changelog."><style>text{font-family:-apple-system, Segoe UI, Helvetica, Arial, sans-serif;fill:#e2ebe8}.tt{font-size:13px;font-weight:600}.tm,.tma{font:600 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;fill:#e2ebe8}.tma{fill:#52c4b3}.ts{font-size:11.5px;fill:#93a6a1}.tl{font-size:11.5px;font-style:italic;fill:#93a6a1}rect{stroke-width:1.5}.file{fill:#18211f;stroke:#3c4c48}.auto,.out{fill:#11302b;stroke:#52c4b3}.out{stroke-width:3.2}.gate{fill:#33250e;stroke:#e9a84b;stroke-dasharray:5 3}.bot{fill:#1c2240;stroke:#9daaf0}.panel{fill:none;stroke:#3c4c48;stroke-width:1;stroke-dasharray:2 3}.rule{stroke:#3c4c48}.edge{fill:none;stroke:#93a6a1;stroke-width:1.4}.edge.accent{stroke:#52c4b3;stroke-width:2}</style><defs><marker id="h" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#93a6a1"/></marker><marker id="ha" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#52c4b3"/></marker></defs><rect x="-16" y="-16" width="1032" height="332" rx="10" fill="#131b1a" stroke="#3c4c48" stroke-width="1"/><rect class="file" x="20" y="30" width="240" height="66" rx="6"/><text class="tm" x="140.0" y="59.5" text-anchor="middle">bots/&lt;slug&gt;/*.md</text><text class="ts" x="140.0" y="75.5" text-anchor="middle">you edit; has {{template_repo}}</text><rect class="file" x="20" y="117" width="240" height="66" rx="6"/><text class="tm" x="140.0" y="146.5" text-anchor="middle">catalog/updater-skill.md</text><text class="ts" x="140.0" y="162.5" text-anchor="middle">{{repo}}  {{slug}}  {{version}}</text><rect class="file" x="20" y="204" width="240" height="66" rx="6"/><text class="tm" x="140.0" y="233.5" text-anchor="middle">catalog.toml</text><text class="ts" x="140.0" y="249.5" text-anchor="middle">repo and template_repo values</text><rect class="auto" x="330" y="117" width="170" height="66" rx="6"/><text class="tm" x="415.0" y="146.5" text-anchor="middle">catalog.py build</text><text class="ts" x="415.0" y="162.5" text-anchor="middle">fills every {{key}}</text><polyline class="edge" points="260,63 328,138" marker-end="url(#h)"/><polyline class="edge" points="260,150 328,150" marker-end="url(#h)"/><polyline class="edge" points="260,237 328,162" marker-end="url(#h)"/><text class="tl" x="300" y="222" text-anchor="end">values</text><rect class="file" x="570" y="30" width="210" height="66" rx="6"/><text class="tm" x="675.0" y="59.5" text-anchor="middle">bots/&lt;slug&gt;/bot.toml</text><text class="ts" x="675.0" y="75.5" text-anchor="middle">fetched as written</text><rect class="out" x="570" y="114" width="210" height="72" rx="6"/><text class="tm" x="675.0" y="139.0" text-anchor="middle">dist/&lt;slug&gt;.md</text><text class="ts" x="675.0" y="155.0" text-anchor="middle">real URLs, no {{…}} left</text><text class="ts" x="675.0" y="170.0" text-anchor="middle">read at tag &lt;slug&gt;-v&lt;ver&gt;</text><rect class="file" x="570" y="204" width="210" height="66" rx="6"/><text class="tm" x="675.0" y="233.5" text-anchor="middle">bots/&lt;slug&gt;/CHANGELOG.md</text><text class="ts" x="675.0" y="249.5" text-anchor="middle">fetched as written</text><polyline class="edge accent" points="500,150 568,150" marker-end="url(#ha)"/><text class="tl" x="534" y="142" text-anchor="middle">writes</text><rect class="bot" x="850" y="90" width="130" height="120" rx="6"/><text class="tt" x="915.0" y="139.0" text-anchor="middle">Installed bot</text><text class="ts" x="915.0" y="155.0" text-anchor="middle">daily update</text><text class="ts" x="915.0" y="170.0" text-anchor="middle">check</text><polyline class="edge" points="780,63 848,115" marker-end="url(#h)"/><text class="tl" x="806" y="80" text-anchor="middle">version</text><polyline class="edge accent" points="780,150 848,150" marker-end="url(#ha)"/><text class="tl" x="814" y="142" text-anchor="middle">applies</text><polyline class="edge" points="780,237 848,185" marker-end="url(#h)"/><text class="tl" x="806" y="230" text-anchor="middle">shows</text></svg>
