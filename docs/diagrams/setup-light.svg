<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 982 262" width="982" height="262" role="img" aria-label="catalog.toml in the template, in a fresh copy, and after the Set up catalog workflow runs."><style>text{font-family:-apple-system, Segoe UI, Helvetica, Arial, sans-serif;fill:#15201e}.tt{font-size:13px;font-weight:600}.tm,.tma{font:600 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;fill:#15201e}.tma{fill:#0e7468}.ts{font-size:11.5px;fill:#566864}.tl{font-size:11.5px;font-style:italic;fill:#566864}rect{stroke-width:1.5}.file{fill:#ffffff;stroke:#a9b9b5}.auto,.out{fill:#e0f1ed;stroke:#0e7468}.out{stroke-width:3.2}.gate{fill:#fbeedb;stroke:#9a5806;stroke-dasharray:5 3}.bot{fill:#e9ecf8;stroke:#3f4f8c}.panel{fill:none;stroke:#a9b9b5;stroke-width:1;stroke-dasharray:2 3}.rule{stroke:#a9b9b5}.edge{fill:none;stroke:#566864;stroke-width:1.4}.edge.accent{stroke:#0e7468;stroke-width:2}</style><defs><marker id="h" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#566864"/></marker><marker id="ha" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0e7468"/></marker></defs><rect x="-16" y="-16" width="982" height="262" rx="10" fill="#fbfdfc" stroke="#a9b9b5" stroke-width="1"/><rect class="file" x="10" y="20" width="250" height="170" rx="6"/><text class="tt" x="24" y="44">Template repo</text><line class="rule" x1="10" y1="56" x2="260" y2="56"/><text class="tm" x="24" y="78">repo = &quot;JaxonWright/…-template&quot;</text><text class="tm" x="24" y="98">template = true</text><text class="tm" x="24" y="118">template_repo = &quot;JaxonWright/…&quot;</text><text class="tm" x="24" y="138">bots/catalog-manager/</text><rect class="file" x="350" y="20" width="250" height="170" rx="6"/><text class="tt" x="364" y="44">Your copy, just made</text><line class="rule" x1="350" y1="56" x2="600" y2="56"/><text class="tma" x="364" y="78">repo = &quot;JaxonWright/…-template&quot;</text><text class="tma" x="364" y="98">template = true</text><text class="tm" x="364" y="118">template_repo = &quot;JaxonWright/…&quot;</text><text class="tm" x="364" y="138">bots/catalog-manager/</text><rect class="file" x="690" y="20" width="250" height="170" rx="6"/><text class="tt" x="704" y="44">After Set up catalog</text><line class="rule" x1="690" y1="56" x2="940" y2="56"/><text class="tma" x="704" y="78">repo = &quot;you/bot-catalog-for-…&quot;</text><text class="tma" x="704" y="98">template = false</text><text class="tm" x="704" y="118">template_repo = &quot;JaxonWright/…&quot;</text><text class="tma" x="704" y="138">catalog-manager removed</text><polyline class="edge" points="260,105 348,105" marker-end="url(#h)"/><text class="tl" x="304" y="82" text-anchor="middle">Use this</text><text class="tl" x="304" y="96" text-anchor="middle">template</text><polyline class="edge accent" points="600,105 688,105" marker-end="url(#ha)"/><text class="tl" x="644" y="82" text-anchor="middle">Set up</text><text class="tl" x="644" y="96" text-anchor="middle">catalog run</text><text class="tl" x="475" y="215" text-anchor="middle">still says it&#x27;s the template</text><text class="tl" x="815" y="215" text-anchor="middle">{{template_repo}} still points home</text></svg>
