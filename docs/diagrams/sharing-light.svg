<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 1022 297" width="1022" height="297" role="img" aria-label="A new bot&#x27;s check fails until a public copy is made from the branch and its share link is committed."><style>text{font-family:-apple-system, Segoe UI, Helvetica, Arial, sans-serif;fill:#15201e}.tt{font-size:13px;font-weight:600}.tm,.tma{font:600 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;fill:#15201e}.tma{fill:#0e7468}.ts{font-size:11.5px;fill:#566864}.tl{font-size:11.5px;font-style:italic;fill:#566864}rect{stroke-width:1.5}.file{fill:#ffffff;stroke:#a9b9b5}.auto,.out{fill:#e0f1ed;stroke:#0e7468}.out{stroke-width:3.2}.gate{fill:#fbeedb;stroke:#9a5806;stroke-dasharray:5 3}.bot{fill:#e9ecf8;stroke:#3f4f8c}.panel{fill:none;stroke:#a9b9b5;stroke-width:1;stroke-dasharray:2 3}.rule{stroke:#a9b9b5}.edge{fill:none;stroke:#566864;stroke-width:1.4}.edge.accent{stroke:#0e7468;stroke-width:2}</style><defs><marker id="h" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#566864"/></marker><marker id="ha" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0e7468"/></marker></defs><rect x="-16" y="-16" width="1022" height="297" rx="10" fill="#fbfdfc" stroke="#a9b9b5" stroke-width="1"/><rect class="file" x="10" y="30" width="140" height="70" rx="6"/><text class="tt" x="80.0" y="54.0" text-anchor="middle">Draft bots/&lt;slug&gt;/</text><text class="ts" x="80.0" y="70.0" text-anchor="middle">personal details</text><text class="ts" x="80.0" y="85.0" text-anchor="middle">stripped</text><rect class="gate" x="175" y="30" width="140" height="70" rx="6"/><text class="tt" x="245.0" y="54.0" text-anchor="middle">Your yes</text><text class="ts" x="245.0" y="70.0" text-anchor="middle">after reading</text><text class="ts" x="245.0" y="85.0" text-anchor="middle">every file</text><rect class="auto" x="340" y="30" width="140" height="70" rx="6"/><text class="tt" x="410.0" y="54.0" text-anchor="middle">PR + Build</text><text class="ts" x="410.0" y="70.0" text-anchor="middle">dist/&lt;slug&gt;.md</text><text class="ts" x="410.0" y="85.0" text-anchor="middle">on the branch</text><rect class="auto" x="505" y="30" width="140" height="70" rx="6"/><text class="tm" x="575.0" y="61.5" text-anchor="middle">check</text><text class="ts" x="575.0" y="77.5" text-anchor="middle">share_url set?</text><rect class="gate" x="670" y="30" width="140" height="70" rx="6"/><text class="tt" x="740.0" y="61.5" text-anchor="middle">Merge</text><text class="ts" x="740.0" y="77.5" text-anchor="middle">same yes covers it</text><rect class="out" x="835" y="30" width="140" height="70" rx="6"/><text class="tt" x="905.0" y="54.0" text-anchor="middle">Release</text><text class="ts" x="905.0" y="70.0" text-anchor="middle">tag + Add Grok Bot</text><text class="ts" x="905.0" y="85.0" text-anchor="middle">button in README</text><polyline class="edge" points="150,65 173,65" marker-end="url(#h)"/><polyline class="edge" points="315,65 338,65" marker-end="url(#h)"/><polyline class="edge" points="480,65 503,65" marker-end="url(#h)"/><polyline class="edge accent" points="645,65 668,65" marker-end="url(#ha)"/><polyline class="edge" points="810,65 833,65" marker-end="url(#h)"/><rect class="bot" x="505" y="180" width="140" height="70" rx="6"/><text class="tt" x="575.0" y="204.0" text-anchor="middle">Publish copy</text><text class="ts" x="575.0" y="220.0" text-anchor="middle">new Bot from branch</text><text class="ts" x="575.0" y="235.0" text-anchor="middle">dist, then share</text><rect class="file" x="340" y="180" width="140" height="70" rx="6"/><text class="tt" x="410.0" y="204.0" text-anchor="middle">Set share_url</text><text class="ts" x="410.0" y="220.0" text-anchor="middle">in bot.toml on</text><text class="ts" x="410.0" y="235.0" text-anchor="middle">the same branch</text><polyline class="edge" points="575,100 575,178" marker-end="url(#h)"/><text class="tl" x="583" y="145" text-anchor="start">no link yet</text><polyline class="edge" points="505,215 482,215" marker-end="url(#h)"/><polyline class="edge" points="410,180 410,102" marker-end="url(#h)"/><text class="tl" x="402" y="145" text-anchor="end">push</text></svg>
