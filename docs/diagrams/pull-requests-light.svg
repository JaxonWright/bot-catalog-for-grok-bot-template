<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 902 432" width="902" height="432" role="img" aria-label="Pull requests from this repo go through Build and forks through Fork check. Both checks pass before a merge, then Release tags each new version."><style>text{font-family:-apple-system, Segoe UI, Helvetica, Arial, sans-serif;fill:#15201e}.tt{font-size:13px;font-weight:600}.tm,.tma{font:600 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;fill:#15201e}.tma{fill:#0e7468}.ts{font-size:11.5px;fill:#566864}.tl{font-size:11.5px;font-style:italic;fill:#566864}rect{stroke-width:1.5}.file{fill:#ffffff;stroke:#a9b9b5}.auto,.out{fill:#e0f1ed;stroke:#0e7468}.out{stroke-width:3.2}.gate{fill:#fbeedb;stroke:#9a5806;stroke-dasharray:5 3}.bot{fill:#e9ecf8;stroke:#3f4f8c}.panel{fill:none;stroke:#a9b9b5;stroke-width:1;stroke-dasharray:2 3}.rule{stroke:#a9b9b5}.edge{fill:none;stroke:#566864;stroke-width:1.4}.edge.accent{stroke:#0e7468;stroke-width:2}</style><defs><marker id="h" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#566864"/></marker><marker id="ha" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0e7468"/></marker></defs><rect x="-16" y="-16" width="902" height="432" rx="10" fill="#fbfdfc" stroke="#a9b9b5" stroke-width="1"/><rect class="file" x="20" y="40" width="150" height="66" rx="6"/><text class="tt" x="95.0" y="69.5" text-anchor="middle">PR from a branch</text><text class="ts" x="95.0" y="85.5" text-anchor="middle">in this repo</text><rect class="auto" x="210" y="40" width="200" height="66" rx="6"/><text class="tt" x="310.0" y="62.0" text-anchor="middle">Build workflow</text><text class="ts" x="310.0" y="78.0" text-anchor="middle">regenerates README, dist,</text><text class="ts" x="310.0" y="93.0" text-anchor="middle">avatars, then commits</text><rect class="auto" x="450" y="40" width="160" height="66" rx="6"/><text class="tm" x="530.0" y="69.5" text-anchor="middle">check.sh</text><text class="ts" x="530.0" y="85.5" text-anchor="middle">tests, check, gitleaks</text><rect class="auto" x="650" y="40" width="200" height="66" rx="6"/><text class="tt" x="750.0" y="62.0" text-anchor="middle">Push + post statuses</text><text class="ts" x="750.0" y="78.0" text-anchor="middle">check and fork-check</text><text class="ts" x="750.0" y="93.0" text-anchor="middle">deletes held runs</text><polyline class="edge" points="170,73 208,73" marker-end="url(#h)"/><polyline class="edge" points="410,73 448,73" marker-end="url(#h)"/><polyline class="edge" points="610,73 648,73" marker-end="url(#h)"/><rect class="file" x="20" y="190" width="150" height="66" rx="6"/><text class="tt" x="95.0" y="219.5" text-anchor="middle">PR from a fork</text><text class="ts" x="95.0" y="235.5" text-anchor="middle">can&#x27;t be pushed to</text><rect class="auto" x="210" y="190" width="200" height="66" rx="6"/><text class="tt" x="310.0" y="212.0" text-anchor="middle">Fork check</text><text class="ts" x="310.0" y="228.0" text-anchor="middle">trusted scripts read the PR</text><text class="ts" x="310.0" y="243.0" text-anchor="middle">bots only, no share_url</text><rect class="gate" x="450" y="190" width="160" height="66" rx="6"/><text class="tt" x="530.0" y="219.5" text-anchor="middle">Moved by Manager</text><text class="ts" x="530.0" y="235.5" text-anchor="middle">after your yes</text><polyline class="edge" points="170,223 208,223" marker-end="url(#h)"/><polyline class="edge" points="410,223 448,223" marker-end="url(#h)"/><text class="tl" x="429" y="215" text-anchor="middle">passed</text><polyline class="edge" points="530,190 530,150 95,150 95,108" marker-end="url(#h)"/><text class="tl" x="312" y="143" text-anchor="middle">re-opened as a branch here</text><rect class="gate" x="210" y="320" width="200" height="66" rx="6"/><text class="tt" x="310.0" y="342.0" text-anchor="middle">Merge to master</text><text class="ts" x="310.0" y="358.0" text-anchor="middle">both checks green</text><text class="ts" x="310.0" y="373.0" text-anchor="middle">and your yes</text><rect class="auto" x="450" y="320" width="160" height="66" rx="6"/><text class="tt" x="530.0" y="349.5" text-anchor="middle">Release workflow</text><text class="ts" x="530.0" y="365.5" text-anchor="middle">check --generated</text><rect class="out" x="650" y="320" width="200" height="66" rx="6"/><text class="tt" x="750.0" y="342.0" text-anchor="middle">Tag &lt;slug&gt;-v&lt;ver&gt;</text><text class="ts" x="750.0" y="358.0" text-anchor="middle">each unreleased bot</text><text class="ts" x="750.0" y="373.0" text-anchor="middle">can&#x27;t move or be deleted</text><polyline class="edge accent" points="750,106 750,285 310,285 310,318" marker-end="url(#ha)"/><text class="tl" x="530" y="278" text-anchor="middle">required checks</text><polyline class="edge" points="410,353 448,353" marker-end="url(#h)"/><polyline class="edge" points="610,353 648,353" marker-end="url(#h)"/></svg>
