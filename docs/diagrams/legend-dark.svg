<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 892 62" width="892" height="62" role="img" aria-label="Key: a gray box is a file in the repository, a teal box is a script or workflow, a thick teal box is what it produces, a blue box is a Grok Bot acting, and a dashed orange box waits for your yes."><style>text{font-family:-apple-system, Segoe UI, Helvetica, Arial, sans-serif;fill:#e2ebe8}.tt{font-size:13px;font-weight:600}.tm,.tma{font:600 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;fill:#e2ebe8}.tma{fill:#52c4b3}.ts{font-size:11.5px;fill:#93a6a1}.tl{font-size:11.5px;font-style:italic;fill:#93a6a1}rect{stroke-width:1.5}.file{fill:#18211f;stroke:#3c4c48}.auto,.out{fill:#11302b;stroke:#52c4b3}.out{stroke-width:3.2}.gate{fill:#33250e;stroke:#e9a84b;stroke-dasharray:5 3}.bot{fill:#1c2240;stroke:#9daaf0}.panel{fill:none;stroke:#3c4c48;stroke-width:1;stroke-dasharray:2 3}.rule{stroke:#3c4c48}.edge{fill:none;stroke:#93a6a1;stroke-width:1.4}.edge.accent{stroke:#52c4b3;stroke-width:2}</style><defs><marker id="h" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#93a6a1"/></marker><marker id="ha" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#52c4b3"/></marker></defs><rect x="-16" y="-16" width="892" height="62" rx="10" fill="#131b1a" stroke="#3c4c48" stroke-width="1"/><rect class="file" x="0" y="4" width="34" height="22" rx="4"/><text class="ts" x="44" y="20">File in the repo</text><rect class="auto" x="176" y="4" width="34" height="22" rx="4"/><text class="ts" x="220" y="20">Script or workflow</text><rect class="out" x="352" y="4" width="34" height="22" rx="4"/><text class="ts" x="396" y="20">What it produces</text><rect class="bot" x="528" y="4" width="34" height="22" rx="4"/><text class="ts" x="572" y="20">A Grok Bot acting</text><rect class="gate" x="704" y="4" width="34" height="22" rx="4"/><text class="ts" x="748" y="20">Waits for your yes</text></svg>
