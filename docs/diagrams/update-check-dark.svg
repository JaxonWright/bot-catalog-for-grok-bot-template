<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 1022 292" width="1022" height="292" role="img" aria-label="The daily update check stops at each failed step and updates only after the user says yes."><style>text{font-family:-apple-system, Segoe UI, Helvetica, Arial, sans-serif;fill:#e2ebe8}.tt{font-size:13px;font-weight:600}.tm,.tma{font:600 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;fill:#e2ebe8}.tma{fill:#52c4b3}.ts{font-size:11.5px;fill:#93a6a1}.tl{font-size:11.5px;font-style:italic;fill:#93a6a1}rect{stroke-width:1.5}.file{fill:#18211f;stroke:#3c4c48}.auto,.out{fill:#11302b;stroke:#52c4b3}.out{stroke-width:3.2}.gate{fill:#33250e;stroke:#e9a84b;stroke-dasharray:5 3}.bot{fill:#1c2240;stroke:#9daaf0}.panel{fill:none;stroke:#3c4c48;stroke-width:1;stroke-dasharray:2 3}.rule{stroke:#3c4c48}.edge{fill:none;stroke:#93a6a1;stroke-width:1.4}.edge.accent{stroke:#52c4b3;stroke-width:2}</style><defs><marker id="h" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#93a6a1"/></marker><marker id="ha" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#52c4b3"/></marker></defs><rect x="-16" y="-16" width="1022" height="292" rx="10" fill="#131b1a" stroke="#3c4c48" stroke-width="1"/><rect class="bot" x="10" y="30" width="135" height="70" rx="6"/><text class="tt" x="77.5" y="61.5" text-anchor="middle">Checks on?</text><text class="ts" x="77.5" y="77.5" text-anchor="middle">auto_update memory</text><rect class="bot" x="176" y="30" width="135" height="70" rx="6"/><text class="tt" x="243.5" y="61.5" text-anchor="middle">Read version</text><text class="ts" x="243.5" y="77.5" text-anchor="middle">master bot.toml</text><polyline class="edge" points="145,65 174,65" marker-end="url(#h)"/><rect class="bot" x="342" y="30" width="135" height="70" rx="6"/><text class="tt" x="409.5" y="61.5" text-anchor="middle">Newer?</text><text class="ts" x="409.5" y="77.5" text-anchor="middle">and not skipped</text><polyline class="edge" points="311,65 340,65" marker-end="url(#h)"/><rect class="bot" x="508" y="30" width="135" height="70" rx="6"/><text class="tt" x="575.5" y="61.5" text-anchor="middle">Fetch bundle</text><text class="ts" x="575.5" y="77.5" text-anchor="middle">dist at the new tag</text><polyline class="edge" points="477,65 506,65" marker-end="url(#h)"/><rect class="bot" x="674" y="30" width="135" height="70" rx="6"/><text class="tt" x="741.5" y="54.0" text-anchor="middle">Compare</text><text class="ts" x="741.5" y="70.0" text-anchor="middle">bundle vs. itself,</text><text class="ts" x="741.5" y="85.0" text-anchor="middle">then changelog</text><polyline class="edge" points="643,65 672,65" marker-end="url(#h)"/><rect class="gate" x="840" y="30" width="135" height="70" rx="6"/><text class="tt" x="907.5" y="61.5" text-anchor="middle">Ask the user</text><text class="ts" x="907.5" y="77.5" text-anchor="middle">never updates alone</text><polyline class="edge" points="809,65 838,65" marker-end="url(#h)"/><rect class="file" x="10" y="180" width="135" height="58" rx="6"/><text class="tt" x="77.5" y="205.5" text-anchor="middle">Stop</text><text class="ts" x="77.5" y="221.5" text-anchor="middle">unless asked</text><polyline class="edge" points="77,100 77,178" marker-end="url(#h)"/><text class="tl" x="85" y="145" text-anchor="start">off</text><rect class="file" x="176" y="180" width="135" height="58" rx="6"/><text class="tt" x="243.5" y="205.5" text-anchor="middle">Tell the user</text><text class="ts" x="243.5" y="221.5" text-anchor="middle">bot or repo is gone</text><polyline class="edge" points="243,100 243,178" marker-end="url(#h)"/><text class="tl" x="251" y="145" text-anchor="start">not found</text><rect class="file" x="342" y="180" width="135" height="58" rx="6"/><text class="tt" x="409.5" y="213.0" text-anchor="middle">Stop quietly</text><polyline class="edge" points="409,100 409,178" marker-end="url(#h)"/><text class="tl" x="417" y="145" text-anchor="start">no</text><rect class="file" x="508" y="180" width="135" height="58" rx="6"/><text class="tt" x="575.5" y="213.0" text-anchor="middle">Try tomorrow</text><polyline class="edge" points="575,100 575,178" marker-end="url(#h)"/><text class="tl" x="583" y="145" text-anchor="start">not tagged yet</text><rect class="out" x="840" y="180" width="135" height="58" rx="6"/><text class="tt" x="907.5" y="205.5" text-anchor="middle">Your answer</text><text class="ts" x="907.5" y="221.5" text-anchor="middle">update, skip, off</text><polyline class="edge accent" points="907,100 907,178" marker-end="url(#ha)"/><text class="tl" x="915" y="145" text-anchor="start">answer</text></svg>
